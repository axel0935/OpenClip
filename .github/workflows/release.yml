name: Release

# Triggered by an annotated tag such as `v0.1.0`. The build produces two
# artifacts — a wheel that contains the web UI, the caption presets and the
# fonts, and a source distribution — attaches them to a GitHub Release and stops
# there. Nothing is published to PyPI; see the note at the end of this file.

on:
  push:
    tags:
      - "v*"

# Least privilege by default; only the release job raises `contents: write`.
permissions:
  contents: read

jobs:
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      # The wheel must contain the UI, so it is staged where the build hook
      # expects it: backend/src/openclip/web (git-ignored, build output only).
      - name: Bundle the web UI into the package
        run: |
          test -f frontend/dist/index.html
          rm -rf backend/src/openclip/web
          cp -r frontend/dist backend/src/openclip/web

      - name: Build distributions
        working-directory: backend
        run: uv build --out-dir ../dist

      - name: Verify the wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "openclip/web/index.html",
              "openclip/data/LICENSE",
              "openclip/data/fonts/Montserrat-Bold.ttf",
              "openclip/data/licenses/Montserrat-OFL.txt",
              "openclip/data/presets/captions/clean-pop.json",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{wheel.name}: {len(names)} files, web UI and data present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  test:
    name: Test the built wheel
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg/ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/openclip-venv
          /tmp/openclip-venv/bin/pip install --upgrade pip
          /tmp/openclip-venv/bin/pip install dist/*.whl

      - name: Smoke-test the installed CLI
        run: |
          /tmp/openclip-venv/bin/openclip --version
          /tmp/openclip-venv/bin/openclip captions --help > /dev/null
          /tmp/openclip-venv/bin/openclip doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("/tmp/doctor.json").read_text())
          # The base wheel has no asr/vision extras installed, so warnings are
          # expected; a failure means the release is broken.
          failed = [c for c in report["checks"] if c["status"] == "fail"]
          if failed:
              raise SystemExit(f"doctor failed: {failed}")
          print("doctor: no failures")
          PY

      - name: Run the backend test suite
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -e .
          python -m pytest

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [dist, test]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

# PyPI publication: intentionally absent.
#
# OpenClip does not publish to PyPI in this workflow. When that changes, use
# PyPI trusted publishing (GitHub OIDC) instead of an API credential: configure a
# trusted publisher for this repository and the `pypi` environment on PyPI,
# then add a `publish-pypi` job modelled on pypa/gh-action-pypi-publish that
# depends on [dist, test], sets the `pypi` environment and requests the
# `id-token` permission in its own `permissions:` block. Do not store any
# long-lived credential in this repository.
